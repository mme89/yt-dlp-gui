name: Build and Release
run-name: Build ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches app version
        shell: bash
        run: |
          app_version=$(python - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(Path("yt_dlp_gui/version.py").read_text(encoding="utf-8"))
          for node in module.body:
              if (
                  isinstance(node, ast.Assign)
                  and any(
                      isinstance(target, ast.Name) and target.id == "APP_VERSION"
                      for target in node.targets
                  )
              ):
                  print(ast.literal_eval(node.value))
                  break
          else:
              raise SystemExit("APP_VERSION not found in yt_dlp_gui/version.py")
          PY
          )

          echo "App version: ${app_version}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            echo "Tag version: ${tag_version}"

            if [[ "${tag_version}" != "${app_version}" ]]; then
              echo "::error::Tag version ${tag_version} does not match APP_VERSION ${app_version}"
              exit 1
            fi
          else
            echo "No tag detected; skipping version match check."
          fi

  build-windows:
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt -c constraints-build.txt
          pip install pyinstaller -c constraints-build.txt

      - name: Build Windows executable
        run: |
          pyinstaller build-specs/yt-dlp-gui-windows.spec --clean

      - name: Create Windows archive
        run: |
          Compress-Archive -Path dist/yt-dlp-gui.exe -DestinationPath yt-dlp-gui-${{ steps.get_version.outputs.version }}-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: yt-dlp-gui-windows
          path: yt-dlp-gui-${{ steps.get_version.outputs.version }}-windows.zip

  build-macos:
    needs: validate-version
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt -c constraints-build.txt
          pip install pyinstaller -c constraints-build.txt

      - name: Build macOS app
        run: |
          pyinstaller build-specs/yt-dlp-gui-mac.spec --clean

      - name: Optimize macOS app bundle
        run: |
          echo "1. Thinning universal binaries to arm64 only..."
          find dist/yt-dlp-gui.app -type f | while read file; do
            if file "$file" | grep -q "Mach-O"; then
              if file "$file" | grep -q "universal"; then
                echo "Thinning: $file"
                lipo "$file" -thin arm64 -output "${file}.tmp" && mv "${file}.tmp" "$file"
                codesign --force --sign - "$file" 2>/dev/null || true
              fi
            fi
          done
          
          echo "2. Converting duplicate framework 'Current' directories to symlinks..."
          find dist/yt-dlp-gui.app -type d -name "Versions" | while read versions_dir; do
            if [ -d "$versions_dir/Current" ] && [ ! -L "$versions_dir/Current" ]; then
              echo "Fixing: $versions_dir/Current"
              rm -rf "$versions_dir/Current"
              ln -s A "$versions_dir/Current"
            fi
          done
          
          echo "Optimization complete!"

      - name: Create macOS archive
        run: |
          # Use ditto instead of zip to properly preserve symlinks
          ditto -c -k --sequesterRsrc --keepParent dist/yt-dlp-gui.app yt-dlp-gui-${{ steps.get_version.outputs.version }}-mac.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: yt-dlp-gui-macos
          path: yt-dlp-gui-${{ steps.get_version.outputs.version }}-mac.zip

  build-linux:
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt -c constraints-build.txt
          pip install pyinstaller -c constraints-build.txt

      - name: Build Linux executable
        run: |
          pyinstaller build-specs/yt-dlp-gui-linux.spec --clean

      - name: Create Linux archive
        run: |
          cd dist
          tar -czf ../yt-dlp-gui-${{ steps.get_version.outputs.version }}-linux.tar.gz yt-dlp-gui/
          cd ..

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: yt-dlp-gui-linux
          path: yt-dlp-gui-${{ steps.get_version.outputs.version }}-linux.tar.gz

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Extract latest changelog section
        run: |
          # Extract content between first ## and second ## (latest version only)
          awk '/^## \[/{if(++count==2) exit; if(count==1) flag=1; next} flag' CHANGELOG.md > release_notes.md

      - name: Detect prerelease tag
        id: release_metadata
        shell: bash
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          if [[ "${tag_name}" =~ -([Aa]lpha|[Bb]eta|[Rr][Cc]|[Pp]review|[Pp]re) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/yt-dlp-gui-windows/yt-dlp-gui-*-windows.zip
            artifacts/yt-dlp-gui-macos/yt-dlp-gui-*-mac.zip
            artifacts/yt-dlp-gui-linux/yt-dlp-gui-*-linux.tar.gz
          draft: false
          prerelease: ${{ steps.release_metadata.outputs.prerelease }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
